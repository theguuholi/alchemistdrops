<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Alchemistdrops Logo: Elixir Drop + Phoenix Wings for Teaching Platform -->
  
  <!-- Main drop body (Elixir-inspired) with gradient -->
  <defs>
    <linearGradient id="dropGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a561d6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6e4a7e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Phoenix wings in cyan/blue (representing knowledge/teaching) -->
  <g fill="#38bdf8" opacity="0.85">
    <!-- Left wing -->
    <path d="M35 45 Q25 48 20 55 Q18 60 22 62 Q28 60 35 55 Z" />
    <path d="M38 52 Q30 54 26 60 Q25 64 28 65 Q32 63 38 58 Z" />
    
    <!-- Right wing -->
    <path d="M65 45 Q75 48 80 55 Q82 60 78 62 Q72 60 65 55 Z" />
    <path d="M62 52 Q70 54 74 60 Q75 64 72 65 Q68 63 62 58 Z" />
  </g>
  
  <!-- Central Elixir drop -->
  <path fill="url(#dropGradient)" 
        d="M50 15 
           C48 18 45 25 43 35 
           Q40 50 40 58 
           Q40 72 50 75 
           Q60 72 60 58 
           Q60 50 57 35 
           C55 25 52 18 50 15 Z" />
  
  <!-- Inner highlight for depth -->
  <ellipse cx="47" cy="50" rx="6" ry="12" fill="#a561d6" opacity="0.3" />
  
  <!-- Small accent drops (teaching/knowledge drops) -->
  <circle cx="35" cy="68" r="2.5" fill="#38bdf8" />
  <circle cx="65" cy="68" r="2.5" fill="#38bdf8" />
  <circle cx="50" cy="78" r="2" fill="#a561d6" opacity="0.6" />
</svg>

